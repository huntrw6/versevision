[package]
name = "versevision-bible"
description = "VerseVision Bible providers: API.Bible, YouVersion, ESV API and local USFM files, the key store and the scripture cache."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
versevision-core = { path = "../versevision-core" }
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
thiserror.workspace = true
regex.workspace = true
fancy-regex.workspace = true
# Same reqwest as StagePilot (0.13, no default features, rustls without a bundled crypto provider). StagePilot installs
# the `ring` provider itself; `Client` creation here installs it when no provider is installed yet (see http.rs).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
# Only the timer, for the one `Retry-After` wait of the StagePilot service client (reqwest already needs tokio).
tokio = { version = "1", default-features = false, features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = "0.8"
pollster = "0.4"
percent-encoding = "2"
tempfile = "3"
