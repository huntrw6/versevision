[package]
name = "versevision"
description = "VerseVision command line: the same commands, options and output as the Python app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "versevision_cli"
path = "src/lib.rs"

[[bin]]
name = "versevision"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
versevision-core = { path = "../versevision-core" }
versevision-pp = { path = "../versevision-pp" }
versevision-bible = { path = "../versevision-bible" }
versevision-docs = { path = "../versevision-docs" }
versevision-web = { path = "../versevision-web" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "signal", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "error-context", "usage"] }
unicode-width = "0.2"
terminal_size = "0.4"
rpassword = "7"
serde_json = { workspace = true }
indexmap = { workspace = true }
pollster = "0.4"
tempfile = "3"

[dev-dependencies]
