[package]
name = "versevision-pp"
description = "VerseVision ProPresenter 19 side: the presentation file writer (protobuf, template, slides, RTF) and the theme reader."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
versevision-core = { path = "../versevision-core" }
prost-reflect = "0.16"
serde = { workspace = true }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
regex = { workspace = true }
thiserror = { workspace = true }


[dev-dependencies]
# Only the test that proves the committed descriptor set is current and the example that rewrites it use these: a consumer never builds them.
protox = "0.10"
prost = "0.14"
serde_json = { workspace = true }
toml = { workspace = true }
