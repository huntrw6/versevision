<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VerseVision</title>
<style>
  /* Styled after ProPresenter 19 (dark): flat charcoal chrome, icon-over-label toolbar, uppercase
     sidebar headings, grey-outlined selection, 16:9 slide cards with a grey label strip. */
  :root{
    --toolbar:#4a4543; --toolbar-lo:#3b3837; --sidebar:#464646; --panel:#2f2f2f; --canvas:#1e1e1e;
    --row-sel:#5c5c5c; --btn:#6e6e6e; --label:#5e5e5e;
    --text:#f4f4f4; --dim:#c4c4c4; --head:#b8b8b8;
    --blue:#2f7bff; --orange:#fdb35f; --red:#e02020; --green:#3fb950; --amber:#e8a33d; --purple:#8f6bd8;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--canvas);color:var(--text);font:13px/1.35 var(--font);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  .hidden{display:none!important}

  #toolbar{height:72px;flex:none;background:linear-gradient(var(--toolbar),var(--toolbar-lo));border-bottom:1px solid #000;display:flex;align-items:stretch;padding:0 10px;gap:2px}
  .brand{display:flex;align-items:center;gap:9px;padding:0 18px 0 8px;font-weight:600;font-size:15px;letter-spacing:.01em}
  .brand b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:linear-gradient(#ff9a3d,#e8590c);color:#fff;font-size:15px}
  .tool{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:66px;padding:0 6px;color:#cfcfcf;cursor:pointer}
  .tool .ico{display:grid;place-items:center;width:46px;height:24px;border-radius:7px}
  .tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .tool span.lbl{font-size:12px}
  .tool:hover,.tool.on{color:#fff}
  .tool.on .ico{background:var(--btn)}
  .sep{width:1px;margin:20px 8px;background:#ffffff1f}
  .spacer{flex:1}
  #status{display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--dim);font-size:12px}
  .led{width:9px;height:9px;border-radius:50%;background:#777;box-shadow:0 0 0 2px #0003}
  .led.ok{background:var(--green)} .led.bad{background:var(--red)}

  #app{flex:1;display:flex;min-height:0}
  aside{width:280px;flex:none;background:var(--sidebar);border-right:1px solid #000;display:flex;flex-direction:column;min-height:0;overflow:auto}
  .sec{padding:12px 12px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--head)}
  .row{display:flex;align-items:center;gap:9px;margin:1px 6px;padding:6px 8px;border-radius:5px;border:1px solid transparent;cursor:default;white-space:nowrap;overflow:hidden;font-size:13.5px}
  .row .badge{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700;color:#fff}
  .badge.o{background:#e9812a} .badge.b{background:#3b7fe0}
  .row.sel{background:var(--row-sel);border-color:#7a7a7a}
  .row.click{cursor:pointer} .row.click:hover:not(.sel){background:#ffffff12}
  .row .t{overflow:hidden;text-overflow:ellipsis}
  .row.dim{opacity:.8}
  #side-note{padding:12px;color:#cfcfcf;font-size:12.5px;line-height:1.45}

  main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--canvas)}
  #titlebar{height:42px;flex:none;background:#1a1a1a;border-bottom:1px solid #000;display:flex;align-items:center;gap:10px;padding:0 16px}
  #titlebar .ic{width:18px;height:18px;border-radius:4px;background:#e9812a;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
  #titlebar h1{margin:0;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #titlebar .meta{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap}
  #stage{flex:1;overflow:auto;padding:18px 22px 24px;min-height:0;display:flex;flex-direction:column}

  #viewImport,#setup{display:flex;flex-direction:column;flex:1;min-height:0}
  #viewHistory{flex:1}
  #viewImport.hidden,#setup.hidden{display:none}
  .dropwrap{flex:1;display:flex;justify-content:center;align-items:center;padding:6px 0 24px}
  #drop{width:min(520px,100%);min-height:280px;border:2px dashed #5a5a5a;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;cursor:pointer;background:#232323;transition:.12s;padding:30px}
  #drop:hover,#drop.over{border-color:var(--blue);background:#1f2733}
  #drop .big{width:64px;height:64px;border-radius:14px;background:#2f2f2f;display:grid;place-items:center;border:1px solid #444}
  #drop .big svg{width:32px;height:32px;stroke:#cfcfcf;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  #drop h2{margin:6px 0 0;font-size:20px;font-weight:500}
  #drop p{margin:0;color:var(--dim)}
  .hint{font-size:12px;color:var(--dim)}
  #dropveil{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#1e1e1ecc;pointer-events:none}
  #dropveil.on{display:flex}
  #dropveil div{border:3px dashed var(--blue);border-radius:16px;background:#1f2733;padding:34px 60px;font-size:20px;font-weight:500}
  #dropveil.bad div{border-color:var(--amber);background:#3a2e16}

  .opts{display:grid;grid-template-columns:1.25fr 1fr 1.35fr .8fr;gap:16px;margin-bottom:22px;align-items:start}
  @media (max-width:1100px){.opts{grid-template-columns:1fr 1fr}}
  .slot{display:grid}
  .slot>*{grid-area:1/1}
  .slot .off{visibility:hidden;pointer-events:none}
  .field{display:flex;flex-direction:column;gap:5px}
  .field>label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--head)}
  select,input[type=text]{background:#3a3a3a;border:1px solid #1a1a1a;border-radius:6px;padding:0 9px;color:var(--text);outline:none;height:34px;box-shadow:inset 0 1px 0 #ffffff10}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#bbb 50%),linear-gradient(135deg,#bbb 50%,transparent 50%);background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
  select:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 2px #2f7bff55}
  select option,select optgroup{background:#2f2f2f;color:var(--text)}
  .seg{display:flex;background:#3a3a3a;border:1px solid #1a1a1a;border-radius:6px;padding:2px;gap:2px;height:34px}
  .seg button{flex:1;background:none;border:0;border-radius:4px;padding:0 8px;color:#d0d0d0;cursor:pointer;font-size:12.5px}
  .seg button.on{background:var(--btn);color:#fff;box-shadow:0 1px 0 #0006}
  select.need{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
  #drop.locked{cursor:not-allowed;border-color:#4a4a4a;background:#232323}
  #drop.locked .big,#drop.locked h2,#drop.locked p{opacity:.4}
  #drop.locked #dropHint{font-size:14px;font-weight:600;color:#ffc470}
  #drop.locked:hover{border-color:#4a4a4a;background:#232323}
  .help{font-size:12.5px;color:var(--dim);line-height:1.4;min-height:35px}

  .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}
  .stat{background:var(--panel);border:1px solid #111;border-radius:8px;padding:9px 16px}
  .stat b{display:block;font-size:24px;font-weight:600;line-height:1.1}
  .stat span{font-size:11.5px;color:#cfcfcf;text-transform:uppercase;letter-spacing:.05em}
  .stat.flag b{color:var(--amber)} .stat.good b{color:var(--green)}
  .banner{margin:0 0 10px;padding:10px 14px;border-radius:7px;font-size:13px;border:1px solid}
  .banner.good{background:#1d3324;border-color:#2c5b3a;color:#bde5c8}
  .banner.warn{background:#3a2e16;border-color:#6b5420;color:#f1d79b}
  .banner.bad{background:#3b1c1c;border-color:#6e2b2b;color:#f2b8b8}
  .banner.info{background:#1c2a3f;border-color:#2c4a77;color:#bcd3f2}
  .grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:14px}
  @media (max-width:980px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid #111;border-radius:8px;overflow:hidden}
  .panel>h3{margin:0;padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--head);background:#262626;border-bottom:1px solid #111;display:flex;justify-content:space-between}
  .panel>h3 em{font-style:normal;color:var(--dim);font-weight:500;letter-spacing:0;text-transform:none}
  .cards{-webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent);mask-image:linear-gradient(#000 calc(100% - 28px),transparent);padding-bottom:30px!important;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:12px;max-height:56vh;overflow:auto;scrollbar-color:#6a6a6a #2a2a2a}
  .card{background:#000;border:1px solid #111;display:flex;flex-direction:column}
  .card .face{aspect-ratio:16/9;padding:12px 14px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .card .ref{color:var(--orange);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .card .body{color:#fff;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;line-height:1.35;margin-top:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
  .card .vn{color:var(--orange);font-weight:800;margin-right:.45em}
  .card.point .face{align-items:center;justify-content:center;text-align:center}
  .card.point .body{font-size:15px;margin:0;-webkit-line-clamp:3}
  .panel>h3 em{color:#cfcfcf}
  .card .strip{background:#6a6a6a;display:flex;justify-content:space-between;align-items:center;padding:3px 8px;font-size:12px;min-height:23px;color:#fff}
  .card .strip b{font-weight:700} .card .strip span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-left:8px}
  .list{max-height:58vh;overflow:auto}
  .item{padding:9px 14px;border-bottom:1px solid #1d1d1d;display:grid;grid-template-columns:38px 1fr;gap:8px}
  .item:last-child{border-bottom:0}
  .item .n{color:var(--dim);font-size:11px;padding-top:2px}
  .item .t{font-weight:600;overflow-wrap:anywhere}
  .item .x{color:var(--dim);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
  .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
  .tag.not_added{background:var(--red);color:#fff} .tag.needs_review{background:var(--amber);color:#1b1200}
  .empty{padding:18px 14px;color:var(--dim)}
  details{margin-top:14px;background:var(--panel);border:1px solid #111;border-radius:8px}
  summary{cursor:pointer;padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--head)}

  #progress{max-width:560px;margin:60px auto;text-align:center}
  #progress .msg{font-size:15px;margin-bottom:14px}
  .bar{height:5px;background:#3a3a3a;border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:34%;background:var(--blue);border-radius:3px;animation:slide 1.15s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-34%}100%{margin-left:100%}}
  #actions{flex:none;background:#262626;border-top:1px solid #000;padding:10px 22px;display:flex;align-items:center;gap:12px}
  #actions .note{flex:1;color:var(--dim);font-size:12px}
  .btn{background:#5a5a5a;border:1px solid #1a1a1a;border-radius:6px;padding:6px 16px;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff1a}
  .btn:hover{background:#666}
  .btn.primary{background:var(--blue);border-color:#1c58c4;color:#fff;font-weight:600}
  .btn.primary:hover{background:#4a8cff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  #bottom{height:30px;flex:none;background:#1a1a1a;border-top:1px solid #000;display:flex;align-items:center;gap:16px;padding:0 22px;color:var(--dim);font-size:12px}
  #bottom label{display:flex;align-items:center;gap:7px;cursor:pointer}
  #bottom input{appearance:none;width:15px;height:15px;border:1px solid #777;border-radius:4px;background:#2a2a2a;display:grid;place-items:center;margin:0;cursor:pointer}
  #bottom input:checked{background:var(--blue);border-color:#1c58c4}
  #bottom input:checked::after{content:'';width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--head);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:6px 10px;border-bottom:1px solid #111;background:#262626}
  td{padding:7px 10px;border-bottom:1px solid #1d1d1d}
  .pill{font-size:11px;padding:1px 7px;border-radius:9px;background:#444;color:#ddd}
  .btn.sm{padding:3px 10px;font-size:12px}
</style>
</head>
<body>

<div id="dropveil"><div id="veilText">Drop to import</div></div>

<div id="toolbar">
  <div class="brand"><b>V</b>VerseVision</div>
  <button class="tool on" id="tab-import" data-view="import"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"/></svg></span><span class="lbl">Import</span></button>
  <button class="tool" id="tab-history" data-view="history"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg></span><span class="lbl">History</span></button>
  <div class="spacer"></div>
  <div id="status"><span class="led" id="led"></span><span id="statusText">Checking…</span></div>
</div>

<div id="app">
  <aside>
    <div class="sec">Library</div>
    <div id="libs"></div>
    <div class="sec">Presentations</div>
    <div id="pres"></div>
    <div id="side-note"></div>
  </aside>

  <main>
    <div id="titlebar"><span class="ic">&#9636;</span><h1 id="ttl">Import sermon notes</h1><span class="meta" id="meta"></span></div>
    <div id="stage">
      <div id="viewImport">
        <div id="setup">
          <div class="opts">
            <div class="field">
              <label>Action</label>
              <div class="seg" id="mode">
                <button data-mode="new" class="on">New</button>
                <button data-mode="replace">Replace</button>
                <button data-mode="append">Append</button>
              </div>
              <div class="help" id="modeHelp"></div>
            </div>
            <div class="field">
              <label for="libSel">Library</label>
              <select id="libSel"></select>
              <div class="help" id="libHelp"></div>
            </div>
            <div class="field">
              <label id="slotLabel" for="title">Name</label>
              <div class="slot">
                <input type="text" id="title" placeholder="Same as the document">
                <select id="target"></select>
              </div>
              <div class="help" id="targetHelp"></div>
            </div>
            <div class="field">
              <label for="ver">Version</label>
              <input type="text" id="ver" placeholder="NKJV" maxlength="12">
              <div class="help">Used when a verse has none.</div>
            </div>
          </div>
          <div class="dropwrap">
          <div id="drop" tabindex="0" role="button" aria-label="Drop a sermon notes file here or press Enter to choose one">
            <div class="big"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></div>
            <h2>Drop your notes here</h2>
            <p>PDF, Word, text or Markdown</p>
            <span class="hint" id="dropHint">or click to pick a file</span>
            <input id="file" type="file" accept=".pdf,.docx,.txt,.md,.html,.htm" class="hidden">
          </div>
          </div>
        </div>

        <div id="progress" class="hidden"><div class="msg" id="progMsg">Working…</div><div class="bar"><i></i></div></div>

        <div id="result" class="hidden">
          <div id="banner"></div>
          <div class="summary" id="stats"></div>
          <div class="grid2">
            <div class="panel"><h3>Slides <em id="addedCount"></em></h3><div class="cards" id="added"></div></div>
            <div class="panel"><h3>To check <em id="flagCount"></em></h3><div class="list" id="flagged"></div></div>
          </div>
          <details id="adjD"><summary>Fixed for you <span id="adjN"></span></summary><div id="adj"></div></details>
          <details id="leftD"><summary>Skipped <span id="leftN"></span></summary><div id="left"></div></details>
        </div>
      </div>

      <div id="viewHistory" class="hidden">
        <div class="panel"><h3>Imports</h3><div id="hist"></div></div>
        <div class="panel" style="margin-top:16px"><h3>Logs <em id="logFolder"></em></h3><div id="runs"></div></div>
        <div class="panel hidden" id="runBox" style="margin-top:16px"><h3>Log <em id="runId"></em><span><button class="btn sm" id="runClose">Close</button></span></h3><pre id="runText" style="margin:0;padding:14px;white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,monospace;max-height:55vh;overflow:auto"></pre></div>
      </div>
    </div>

    <div id="actions" class="hidden"><div class="note" id="actionNote"></div><button class="btn" id="again">Back</button><button class="btn primary" id="go">Import</button></div>
    <div id="bottom">
      <label id="autoWrap" class="hidden"><input type="checkbox" id="auto"> Open VerseVision at login</label>
      <span id="autoNote"></span>
    </div>
  </main>
</div>

<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const H = TOKEN ? {'X-VerseVision-Token': TOKEN} : {};
const $ = id => document.getElementById(id);
const state = {mode:'new', current:null, pres:[], libs:[], defaultLib:'Verses', target:'', libSel:'', view:'import'};

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
async function api(path, opts={}){
  const r = await fetch(path, {...opts, headers:{...H, ...(opts.headers||{})}});
  const j = await r.json().catch(()=>({error:'Unreadable response'}));
  if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}
const show = (id,on)=>$(id).classList.toggle('hidden', !on);

async function status(){
  try{
    const [s, c] = await Promise.all([api('/api/status'), api('/api/check')]);
    $('led').className = 'led '+(c.ok?'ok':'bad');
    $('statusText').textContent = c.ok ? s.node+' \u00b7 '+(c.propresenter||'ProPresenter') : "Can't reach ProPresenter on "+s.node;
    $('meta').textContent = s.template_ready ? '' : 'Template missing. Run: versevision template setup';
    state.defaultLib = s.library || 'Verses';
    if(s.default_version && !$('ver').value) $('ver').value = s.default_version;
  }catch(e){ $('statusText').textContent = e.message; }
}
async function loadPresentations(){
  try{
    const d = await api('/api/presentations');
    state.pres = d.presentations; state.libs = d.libraries; state.defaultLib = d.default_library || state.defaultLib;
    if(!state.libSel) state.libSel = state.defaultLib;
    drawSidebar(); fillSelects();
  }catch(e){}
}
function drawSidebar(){
  const libs = $('libs'); libs.replaceChildren();
  for(const name of state.libs){
    const r = el('div','row click'+(name===state.libSel?' sel':'')); r.append(el('span','badge o','\u25a4'), el('span','t',name));
    r.onclick = ()=>{ state.libSel = name; $('libSel').value = name; drawSidebar(); };
    libs.append(r);
  }
  const box = $('pres'); box.replaceChildren();
  const items = state.pres.filter(p=>p.library===state.libSel);
  for(const p of items){
    const picking = state.mode!=='new';
    const r = el('div','row'+((picking&&p.uuid===state.target)?' sel':'')+(picking?' click':' dim'));
    r.title = p.name; r.append(el('span','badge b','\u25a4'), el('span','t',p.name));
    if(picking) r.onclick = ()=>{ state.target = p.uuid; $('target').value = p.uuid; state.libSel = p.library; drawSidebar(); updateHelp(); };
    box.append(r);
  }
  if(!items.length) box.append(el('div','empty','No presentations in this library.'));
  $('side-note').textContent = state.mode==='new'
    ? 'New presentations go in \u201c'+state.libSel+'\u201d.'
    : 'Click a presentation to pick it.';
}
function fillSelects(){
  const ls = $('libSel'); ls.replaceChildren();
  for(const l of state.libs){ const o = el('option','',l); o.value=l; ls.append(o); }
  ls.value = state.libSel || state.defaultLib;
  const t = $('target'); t.replaceChildren();
  const ph = el('option','','Pick one\u2026'); ph.value=''; t.append(ph);
  const groups = {};
  for(const p of state.pres){ (groups[p.library] = groups[p.library]||[]).push(p); }
  for(const lib of Object.keys(groups)){
    const og = document.createElement('optgroup'); og.label = lib;
    for(const p of groups[lib]){ const o = el('option','',p.name); o.value = p.uuid; og.append(o); }
    t.append(og);
  }
  t.value = state.target || '';
}
$('libSel').onchange = e=>{ state.libSel = e.target.value; drawSidebar(); };
$('target').onchange = e=>{ state.target = e.target.value; drawSidebar(); updateHelp(); };
$('target').addEventListener('change', ()=>{});

const HELP = {
  new:'Makes a new presentation.',
  replace:'Saves a copy with new verses and points. Other slides stay.',
  append:'Saves a copy with the slides added at the end.'
};
function setMode(m){
  state.mode = m;
  document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on', b.dataset.mode===m));
  $('title').classList.toggle('off', m!=='new'); $('target').classList.toggle('off', m==='new');
  $('slotLabel').textContent = m==='new' ? 'Name' : 'Presentation';
  $('slotLabel').htmlFor = m==='new' ? 'title' : 'target';
  $('libHelp').textContent = m==='new' ? 'Where it goes.' : 'Shows its presentations.';
  $('modeHelp').textContent = HELP[m]; updateHelp(); drawSidebar();
  $('ttl').textContent = m==='new' ? 'New presentation' : (m==='replace' ? 'Replace slides' : 'Append slides');
}
function m_is_new(){ return state.mode==='new'; }
function updateHelp(){
  const need = state.mode!=='new' && !state.target;
  $('targetHelp').textContent = m_is_new() ? 'Blank uses the document title.' : (need ? 'Pick one to continue.' : '');
  $('target').classList.toggle('need', need);
  $('drop').classList.toggle('locked', need);
  $('drop').setAttribute('aria-disabled', need ? 'true' : 'false');
  $('dropHint').textContent = need ? 'Pick a presentation first' : 'or click to pick a file';
  
}
document.querySelectorAll('#mode button').forEach(b=>b.onclick = ()=>setMode(b.dataset.mode));

async function poll(jobId, onTick){
  for(;;){
    const j = await api('/api/jobs/'+jobId);
    onTick && onTick(j);
    if(j.state!=='running') return j;
    await new Promise(r=>setTimeout(r,700));
  }
}
function flash(msg){ const b=$('modeHelp'); b.textContent = msg; b.style.color = 'var(--amber)'; setTimeout(()=>{ b.style.color=''; b.textContent = HELP[state.mode]; }, 3500); }
function banner(kind, text){ return el('div','banner '+kind, text); }

async function handleFile(file){
  if(!file) return;
  if(state.mode!=='new' && !state.target){ $('target').focus(); flash('Pick a presentation first.'); $('file').value=''; return; }
  show('setup', false); show('result', false); show('progress', true); show('actions', false);
  $('progMsg').textContent = 'Reading '+file.name+'\u2026';
  try{
    const q = new URLSearchParams({mode: state.mode});
    if($('ver').value.trim()) q.set('version', $('ver').value.trim());
    if(state.mode==='new'){ if($('title').value.trim()) q.set('title', $('title').value.trim()); q.set('library', $('libSel').value || state.libSel || ''); }
    else q.set('target', state.target);
    const {job} = await api('/api/plan?'+q, {method:'POST', body:file, headers:{'X-File-Name': file.name}});
    const done = await poll(job, j=>{ $('progMsg').textContent=j.message; });
    if(done.state==='error') throw new Error(done.error);
    state.current = {job, report: done.result};
    render(done.result);
  }catch(e){
    show('progress', false); show('result', true); show('actions', true);
    $('banner').replaceChildren(banner('bad','Couldn\u2019t read this: '+e.message));
    for(const id of ['stats','added','flagged','adj','left']) $(id).replaceChildren();
    show('adjD',false); show('leftD',false); show('go', false); $('actionNote').textContent='';
    state.current = null;
  }
}

function render(r){
  show('progress', false); show('result', true); show('actions', true); show('go', true);
  const s = r.summary;
  $('ttl').textContent = r.mode==='new' ? (r.title||'New presentation') : (r.target?r.target.name:'Presentation');
  $('meta').textContent = r.mode==='new' ? 'New in '+r.library : (r.mode==='replace'?'Replace':'Append');
  const stats = $('stats'); stats.replaceChildren();
  const stat = (n,l,cls)=>{ const d=el('div','stat '+(cls||'')); d.append(el('b','',String(n)), el('span','',l)); return d; };
  stats.append(stat(s.slides,'slides'), stat(s.verse_slides,'verses'), stat(s.point_slides,'points'), stat(s.flagged,'to check', s.flagged?'flag':'good'));
  const b = $('banner'); b.replaceChildren();
  if(s.slides===0) b.append(banner('bad','No slides found in this file.'));

  else if(s.flagged>0) b.append(banner('warn',s.flagged+' line'+(s.flagged===1?'':'s')+' to check. They are skipped unless you fix the notes.'));
  if(r.mode==='new') b.append(banner('info','Makes \u201c'+r.title+'\u201d in '+r.library+'.'));
  else if(r.mode==='replace') b.append(banner('info','Saves a copy of \u201c'+r.target.name+'\u201d with new verses and points. The original stays.'));
  else b.append(banner('info','Saves a copy of \u201c'+r.target.name+'\u201d with '+s.slides+' slides added. The original stays.'));

  const added = $('added'); added.replaceChildren();
  for(const sl of r.slides){
    const c = el('div','card '+sl.kind); const face = el('div','face');
    if(sl.kind==='verse'){
      const body = el('div','body'); const m = /^(\d+)\s+(.*)$/s.exec(sl.text);
      if(m){ body.append(el('span','vn',m[1]), document.createTextNode(m[2])); } else body.textContent = sl.text;
      face.append(el('div','ref',sl.title), body);
    }
    else face.append(el('div','body',sl.text));
    const strip = el('div','strip'); strip.append(el('b','',String(sl.n)), el('span','',sl.title));
    c.append(face, strip); added.append(c);
  }
  if(!r.slides.length) added.append(el('div','empty','Nothing to import.'));
  $('addedCount').textContent = '';

  const fl = $('flagged'); fl.replaceChildren();
  for(const f of r.flagged){
    const it = el('div','item'); it.append(el('div','n','L'+f.line));
    const body = el('div'); const t = el('div','t');
    t.append(el('span','tag '+f.status, f.status==='not_added'?'Skipped':'Check'), document.createTextNode(f.text.length>110?f.text.slice(0,110)+'\u2026':f.text));
    body.append(t, el('div','x',f.detail)); it.append(body); fl.append(it);
  }
  if(!r.flagged.length) fl.append(el('div','empty','All clear.'));
  $('flagCount').textContent = '';
  fill('adj','adjD','adjN', r.adjustments); fill('left','leftD','leftN', r.left_out);

  const go = $('go');
  go.textContent = r.mode==='new' ? 'Create' : r.mode==='replace' ? 'Replace' : 'Append';
  go.disabled = s.slides===0;
  $('actionNote').textContent = 'Nothing existing changes. ProPresenter stays open.' + (r.run_id ? '  Log: ' + r.run_id : '');
}
function fill(listId, detId, nId, rows){
  const box = $(listId); box.replaceChildren();
  for(const x of rows){
    const it = el('div','item'); it.append(el('div','n','L'+x.line));
    const body = el('div'); body.append(el('div','t',x.text.length>100?x.text.slice(0,100)+'\u2026':x.text), el('div','x',x.detail)); it.append(body); box.append(it);
  }
  $(nId).textContent = rows.length ? '('+rows.length+')' : '';
  show(detId, rows.length>0);
}

$('go').onclick = async ()=>{
  if(!state.current) return;
  const r = state.current.report;
  if(r.flagged.length && !confirm(r.flagged.length+' line(s) will be skipped. Continue with the other '+r.summary.slides+' slides?')) return;
  $('go').disabled = true; show('result', false); show('progress', true); $('progMsg').textContent='Starting\u2026';
  try{
    const {job} = await api('/api/apply', {method:'POST', body:JSON.stringify({job: state.current.job, accept_flags: true})});
    const done = await poll(job, j=>{ $('progMsg').textContent=j.message; });
    show('progress', false); show('result', true);
    if(done.state==='error') throw new Error(done.error);
    const a = done.result;
    $('banner').replaceChildren(banner(a.verified?'good':'warn',
      'Created \u201c'+a.presentation_name+'\u201d ('+a.cue_count_after+' slides).'+(a.steps.some(x=>x.startsWith('added to playlist')) ? ' It is in the playlist under the original.' : '')));
    show('go', false); $('actionNote').textContent = 'Done. Undo is in History.' + (state.current && state.current.report.run_id ? '  Log: ' + state.current.report.run_id : '');
    loadPresentations(); loadHistory();
  }catch(e){
    show('progress', false); show('result', true); $('go').disabled=false;
    $('banner').replaceChildren(banner('bad','Didn\u2019t finish: '+e.message));
  }
};
$('again').onclick = ()=>{ show('result',false); show('progress',false); show('actions',false); show('setup',true); $('file').value=''; state.current=null; setMode(state.mode); };

async function loadHistory(){
  const rows = await api('/api/history').catch(()=>[]);
  const box = $('hist'); box.replaceChildren();
  if(!rows.length){ box.append(el('div','empty','Nothing yet.')); return; }
  const t = el('table'); const hr = el('tr');
  for(const h of ['When','File','Presentation','Slides','']) hr.append(el('th','',h));
  t.append(hr);
  for(const r of rows){
    const tr = el('tr');
    tr.append(el('td','',new Date(r.when).toLocaleString()), el('td','',r.source), el('td','',r.target + (r.mode==='new'?'  (new)':'')), el('td','',String(r.slides)));
    const last = el('td');
    if(r.status==='active'){ const b = el('button','btn sm','Undo'); b.onclick = ()=>undo(r, b); last.append(b); }
    else last.append(el('span','pill',r.status));
    tr.append(last); t.append(tr);
  }
  box.append(t);
}
async function loadRuns(){
  const rows = await api('/api/runs').catch(()=>[]);
  const box = $('runs'); box.replaceChildren();
  if(!rows.length){ box.append(el('div','empty','Nothing yet.')); return; }
  $('logFolder').textContent = rows[0].path.replace(/[^/\\]+$/, '');
  const t = el('table'); const hr = el('tr');
  for(const h of ['When','Action','File','Result','']) hr.append(el('th','',h));
  t.append(hr);
  for(const r of rows){
    const tr = el('tr');
    const when = r.id.slice(0,8).replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3') + ' ' + r.id.slice(9,15).replace(/(\d{2})(\d{2})(\d{2})/, '$1:$2:$3');
    const result = el('span','pill', r.outcome); if(r.outcome==='ok') result.classList.add('active');
    const td = el('td'); td.append(result);
    tr.append(el('td','',when), el('td','',r.mode), el('td','',r.source), td);
    const last = el('td'); const b = el('button','btn sm','View'); b.onclick = ()=>openRun(r.id); last.append(b); tr.append(last); t.append(tr);
  }
  box.append(t);
}
async function openRun(id){
  try{ const d = await api('/api/run/'+id); $('runText').textContent = d.summary; $('runId').textContent = d.id; show('runBox', true); $('runBox').scrollIntoView({behavior:'smooth'}); }
  catch(e){ alert(e.message); }
}
$('runClose').onclick = ()=>show('runBox', false);

async function undo(r, btn){
  const msg = r.mode==='new' ? 'Delete \u201c'+r.target+'\u201d?' : 'Remove the slides this added? Other changes stay.';
  if(!confirm(msg)) return;
  btn.disabled = true; setView('import'); show('setup',false); show('result',false); show('progress', true); $('progMsg').textContent='Starting\u2026';
  try{
    const {job} = await api('/api/undo', {method:'POST', body:JSON.stringify({id:r.id})});
    const done = await poll(job, j=>{ $('progMsg').textContent=j.message; });
    if(done.state==='error') throw new Error(done.error);
  }catch(e){ alert(e.message); }
  show('progress', false); show('setup', true); loadHistory(); loadPresentations();
}

function setView(v){
  state.view = v; show('viewImport', v==='import'); show('viewHistory', v==='history');
  $('tab-import').classList.toggle('on', v==='import'); $('tab-history').classList.toggle('on', v==='history');
  if(v==='history'){ $('ttl').textContent='History'; $('meta').textContent=''; loadHistory(); loadRuns(); show('actions', false); }
  else if(state.current){ show('actions', true); } else { setMode(state.mode); }
}
document.querySelectorAll('.tool').forEach(b=>b.onclick = ()=>setView(b.dataset.view));

const drop = $('drop'), fileInput = $('file');
drop.addEventListener('click', ()=>{ if(state.mode!=='new' && !state.target){ $('target').focus(); flash('Pick a presentation first.'); return; } fileInput.click(); });
drop.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); drop.click(); }});
fileInput.addEventListener('change', ()=>handleFile(fileInput.files[0]));
for(const ev of ['dragenter','dragover']) drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add('over'); });
for(const ev of ['dragleave','drop']) drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.remove('over'); });
/* A file dropped anywhere on the page is imported, not only on the box. */
const OK_EXT = ['.pdf','.docx','.txt','.md','.html','.htm'];
let dragDepth = 0;
const hasFile = e => e.dataTransfer && [...(e.dataTransfer.types||[])].includes('Files');
const busy = () => !$('progress').classList.contains('hidden');
function veil(on, bad, text){ $('dropveil').classList.toggle('on', on); $('dropveil').classList.toggle('bad', !!bad); if(text) $('veilText').textContent = text; }
function lockedNow(){ return state.mode!=='new' && !state.target; }
window.addEventListener('dragenter', e=>{ if(!hasFile(e)) return; e.preventDefault(); dragDepth++;
  veil(true, busy()||lockedNow(), busy() ? 'Hold on, still working\u2026' : lockedNow() ? 'Pick a presentation first' : 'Drop to import'); });
window.addEventListener('dragover', e=>{ e.preventDefault(); if(e.dataTransfer) e.dataTransfer.dropEffect = (busy()||lockedNow()) ? 'none' : 'copy'; });
window.addEventListener('dragleave', e=>{ if(!hasFile(e)) return; dragDepth = Math.max(0, dragDepth-1); if(!dragDepth) veil(false); });
window.addEventListener('drop', e=>{
  e.preventDefault(); dragDepth = 0; veil(false);
  const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(!file || busy()) return;
  const ext = file.name.slice(file.name.lastIndexOf('.')).toLowerCase();
  if(!OK_EXT.includes(ext)){ setView('import'); show('result', false); show('setup', true); flash('Use a PDF, Word, text, Markdown or HTML file.'); return; }
  if(state.view!=='import') setView('import');
  handleFile(file);
});

async function autostart(){
  try{
    const s = await api('/api/autostart');
    show('autoWrap', !!s.supported); $('auto').checked = !!s.enabled;
    $('autoNote').textContent = s.enabled && s.port ? 'On: starts at login at http://'+(s.host||'127.0.0.1')+':'+s.port+'/' : '';
  }catch(e){}
}
$('auto').onchange = async (ev)=>{
  const want = ev.target.checked; ev.target.disabled = true;
  try{
    await api('/api/autostart', {method:'POST', body:JSON.stringify({enabled: want})});
    $('autoNote').textContent = want ? 'On: starts at login at '+location.origin+'/' : 'Off. This page keeps running until you close VerseVision or restart the computer.';
  }catch(e){ alert(e.message); ev.target.checked = !want; }
  ev.target.disabled = false;
  if(want) setTimeout(autostart, 1500);
};

setMode('new'); updateHelp(); status(); loadPresentations(); loadHistory(); autostart();
</script>
</body>
