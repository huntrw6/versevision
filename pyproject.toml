[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "versevision"
version = "0.14.1"
description = "Cross-platform Bible reference importer foundations for ProPresenter"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.12",
  "filelock>=3.16",
  "httpx>=0.28",
  "platformdirs>=4.3",
  "pydantic>=2.8",
  "pydantic-settings>=2.6",
  "pypdf>=5",
  "psutil>=6.1",
  "python-docx>=1.1",
  "protobuf>=5",
  "rapidfuzz>=3.10",
  "rich>=13.7",
  "tomli-w>=1.1",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.70", "hypothesis>=6.100", "pyinstaller>=6.10", "pytest>=8", "pytest-asyncio>=0.25", "pytest-cov>=5", "respx>=0.22"]

[project.scripts]
versevision = "versevision.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/versevision"]

[tool.hatch.build.targets.wheel.force-include]
"src/versevision/web/index.html" = "versevision/web/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
